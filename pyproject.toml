[project]
name = "sim-mirror"
dynamic = ["version"]
description = "Mirror and drive the iOS Simulator from Claude Code, CLI agents and the browser."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md"]
authors = [{ name = "Andrew Kochulab" }]
requires-python = ">=3.10"
keywords = ["ios-simulator", "simulator", "mcp", "claude-code", "ai-agents", "ui-automation", "screen-mirroring"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/AndrewKochulab/sim-mirror"
Issues = "https://github.com/AndrewKochulab/sim-mirror/issues"
Changelog = "https://github.com/AndrewKochulab/sim-mirror/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/sim_mirror/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sim_mirror"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=7.1",
    "ruff>=0.15.9",
]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["sim_mirror"]

[tool.coverage.report]
precision = 2
fail_under = 99
show_missing = true
skip_covered = true
