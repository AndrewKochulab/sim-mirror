<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SimMirror in an iframe</title>
<style>
  body { margin: 0; padding: 24px; font: 15px/1.5 system-ui, sans-serif; background: #f5f5f7; color: #1d1d1f; }
  main { max-width: 560px; margin: 0 auto; }
  iframe { display: block; width: 100%; height: 80vh; border: 0; border-radius: 16px; background: #000; }
  .problem { color: #b3261e; }
</style>
<main>
  <h1>My app</h1>
  <p>The simulator below is SimMirror's embed page, opened with a one-shot ticket this page's backend minted.</p>
  <iframe id="simulator" title="iOS Simulator"></iframe>
  <p id="problem" class="problem" hidden></p>
</main>
<script type="module">
  const frame = document.getElementById('simulator')
  const problem = document.getElementById('problem')
  try {
    // A ticket opens the viewer once: ask for a fresh one each time the page loads.
    const answer = await fetch('/api/embed-ticket', { method: 'POST' })
    const body = await answer.json()
    if (!answer.ok) throw new Error(body.error)
    frame.src = body.embed_url
  } catch (err) {
    problem.textContent = err.message
    problem.hidden = false
  }
</script>
</html>
