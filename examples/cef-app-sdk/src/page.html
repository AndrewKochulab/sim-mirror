<!doctype html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>CEF sample</title>
<style>
  body { font: 14px -apple-system, sans-serif; margin: 16px; background: #fff; color: #111; }
  button, input { font: inherit; padding: 6px 10px; margin: 4px 0; }
  #list { height: 160px; overflow-y: auto; border: 1px solid #999; width: 260px; }
  #list li { padding: 4px; }
  #hover, #context, #click { display: inline-block; padding: 10px; border: 1px dashed #666; margin: 4px; }
  #hover.on { background: #cdf; }
  canvas { border: 1px solid #999; display: block; }
</style>
</head>
<body>
<h1>CEF sample</h1>
<button id="increment">Increment</button> <span id="count" aria-live="polite">Count 0</span>
<div><label for="name">Name</label> <input id="name" placeholder="Your name"></div>
<div id="hover" role="note">Hover target</div>
<div id="context" role="note">Right-click target</div>
<div id="click" role="note">Click target</div>
<p id="keys">Last key: none</p>
<ul id="list" aria-label="Items"></ul>
<canvas id="canvas" width="260" height="80" aria-label="Canvas"></canvas>
<p id="dragged">Drag: none</p>
<output id="state" aria-label="State"></output>
<script>
  const state = { count: 0, name: '', hover: false, context: 0, key: '', scroll: 0, canvas: 0, drag: '', click: '' };
  const held = (event) => ['metaKey:cmd', 'shiftKey:shift', 'altKey:alt', 'ctrlKey:ctrl']
    .filter((pair) => event[pair.split(':')[0]]).map((pair) => pair.split(':')[1] + '+').join('');
  const report = () => {
    const { at, ...shown } = state;
    document.title = JSON.stringify(state);
    document.getElementById('state').textContent = JSON.stringify(shown);
  };
  const list = document.getElementById('list');
  for (let i = 1; i <= 60; i++) {
    const item = document.createElement('li');
    item.textContent = 'Item ' + i;
    list.appendChild(item);
  }
  document.getElementById('increment').addEventListener('click', () => {
    state.count++; document.getElementById('count').textContent = 'Count ' + state.count; report();
  });
  const name = document.getElementById('name');
  name.addEventListener('input', () => { state.name = name.value; report(); });
  const hover = document.getElementById('hover');
  hover.addEventListener('mouseenter', () => { state.hover = true; hover.classList.add('on'); report(); });
  hover.addEventListener('mouseleave', () => { state.hover = false; hover.classList.remove('on'); report(); });
  document.getElementById('context').addEventListener('contextmenu', (event) => {
    event.preventDefault(); state.context++;
    document.getElementById('context').textContent = 'Right-clicked ' + held(event) + state.context; report();
  });
  document.addEventListener('keydown', (event) => {
    state.key = held(event) + event.key + (event.isTrusted ? '' : '?');
    document.getElementById('keys').textContent = 'Last key: ' + state.key; report();
  });
  // What a click was: its kind, button and count, and the keys held -- a double click is "dblclick 0x2".
  for (const type of ['click', 'dblclick', 'auxclick']) {
    document.getElementById('click').addEventListener(type, (event) => {
      state.click = held(event) + type + ' ' + event.button + 'x' + event.detail;
      document.getElementById('click').textContent = 'Click: ' + state.click; report();
    });
  }
  list.addEventListener('scroll', () => { state.scroll = Math.round(list.scrollTop); report(); });
  const canvas = document.getElementById('canvas');
  let start = null;
  canvas.addEventListener('pointerdown', (event) => { start = [event.offsetX, event.offsetY]; state.canvas++; report(); });
  canvas.addEventListener('pointerup', (event) => {
    if (start) state.drag = held(event) + Math.round(event.offsetX - start[0]) + ',' + Math.round(event.offsetY - start[1]);
    start = null; document.getElementById('dragged').textContent = 'Drag: ' + state.drag; report();
  });
  const rect = (id) => { const r = document.getElementById(id).getBoundingClientRect(); return [Math.round(r.x + r.width / 2), Math.round(r.y + r.height / 2)]; };
  state.at = { increment: rect('increment'), name: rect('name'), hover: rect('hover'), context: rect('context'), click: rect('click'), list: rect('list'), canvas: rect('canvas') };
  report();
</script>
</body>
</html>
