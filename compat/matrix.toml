# Where SimMirror is expected to work, and where it has been checked. `make generate` writes docs/compatibility.md
# from this file (scripts/gen_docs.py).
#
# A row's status is one of:
#   expected             -- it should work, and nobody has checked it on real hardware yet;
#   unsupported          -- not supported;
#   verified YYYY-MM-DD  -- checked end to end on real hardware on that date, by a walkthrough or a compatibility
#                           report. Nothing else may say verified.

[[section]]
title = "macOS"
column = "Version"
note = "SimMirror needs a Mac with a logged-in desktop session: simulators do not show over SSH or from a launch daemon."

[[section.row]]
name = "macOS 26"
status = "verified 2026-09-16"
notes = "Checked end to end on macOS 26.6.2. Xcode 26 needs macOS 26.2 or later, Xcode 27 macOS 26.6 or later."

[[section.row]]
name = "macOS 15"
status = "expected"
notes = "With Xcode 16.4: the simctl connector only (view-only), since idb_companion 1.5 needs Xcode 26."

[[section.row]]
name = "Intel Macs"
status = "unsupported"
notes = "idb_companion 1.5 is built for Apple Silicon, and Xcode 27 runs only on Apple Silicon."

[[section]]
title = "Xcode"
column = "Version"

[[section.row]]
name = "Xcode 26"
status = "verified 2026-09-16"
notes = "Checked end to end with Xcode 26.6 (17F113) and the iOS 18.6 and 26.5 runtimes, on an iPhone 17 Pro simulator."

[[section.row]]
name = "Xcode 27"
status = "verified 2026-09-16"
notes = "Checked with Xcode 27.0 (27A266a) and the iOS 27.0 runtime on an iPhone 18 Pro, beside Xcode 26.6 and chosen both by xcode-select and by device.developer_dir: the live screen in Chrome, touches, named keys, Home, the element tree, the agent tools and the doctor's tap. Text is typed as key presses (#27): an agent's type step and the viewer's typing arrived on iOS 27.0 and 26.5 alike, and a paste, which iOS 27.0 refuses, is left for text no key types. SimulatorKit moved to Contents/SharedFrameworks. With Device Hub open, a device booted then still took idb's taps; one Device Hub has taken over may not (not checked)."

[[section.row]]
name = "Xcode 16.4 and earlier"
status = "expected"
notes = "The simctl connector only (view-only)."

[[section]]
title = "Connectors"
column = "Connector"
note = "`auto` uses idb where idb_companion is installed and falls back to simctl, saying why. See Connectors."

[[section.row]]
name = "idb (idb_companion 1.5)"
status = "verified 2026-09-16"
notes = "Full control, all checked on a device: H.264 and JPEG streams, touch, drag, wheel, buttons, appearance, typing, paste and the element tree."

[[section.row]]
name = "simctl"
status = "verified 2026-09-16"
notes = "View-only, checked on a device with the companion hidden: JPEG at up to 4 frames a second, screenshots, appearance, install, launch, open URL, logs. No input and no element tree, and the tools that need them are refused."

[[section.row]]
name = "mcpbridge (Xcode 27.0)"
status = "verified 2026-09-16"
notes = "Checked on an iOS 27.0 simulator with Xcode 27.0 (27A266a) named by device.developer_dir while xcode-select named Xcode 26.6: the screen in Chrome, view-only; Claude Code's snapshots of Safari through Xcode's UI hierarchy; the doctor's read; sim-mirror xcode approve. Merged into idb's snapshots (connectors.mcpbridge.merge), Claude Code saw example.com's link and tapped it through idb. Xcode's session was ended a minute after the last read and when the daemon stopped."

[[section]]
title = "Build and test"
column = "Xcode"
note = "`sim_build_run` and `sim_test`, driven by Claude Code on a probe project with XCTest and Swift Testing suites, a scheme named `Probe (Staging)` and a test target that does not compile."

[[section.row]]
name = "Xcode 26.6"
status = "verified 2026-09-16"
notes = "On an iOS 26.5 simulator: failures at their project paths, each failing test run again alone by the id the answer gave, the compile error of tests that do not build, and a build in the Staging configuration installed and launched."

[[section.row]]
name = "Xcode 27.0"
status = "verified 2026-09-16"
notes = "On an iOS 27.0 simulator, and a run sent to an iOS 26.5 one with `destination`: the same answers, with a failure's place read from the `sourceLocation` Xcode 27 gives, and a refused configuration answered with the ones the project has."

[[section]]
title = "MCP clients"
column = "Client"

[[section.row]]
name = "Claude Code in a terminal, with the plugin"
status = "expected"
notes = "`/plugin install sim-mirror@sim-mirror`. The plugin manifest validates; the tools themselves were checked through the same server started by hand."

[[section.row]]
name = "Claude Code in a terminal, with `claude mcp add`"
status = "verified 2026-09-16"
notes = "A session drove a real device through the tools: snapshots and taps, no screenshots, its name on the cursor in the viewer."

[[section.row]]
name = "OpenAI Codex"
status = "expected"
notes = "Raise `tool_timeout_sec` for build tools."

