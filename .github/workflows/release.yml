name: Release

# A tag `v<version>` builds the Python sdist and wheel -- the wheel carrying the native helper, built universal and
# signed ad hoc -- and the viewer's npm package, and attaches them to a GitHub Release
# whose notes are that version's CHANGELOG.md section. Both are then published by trusted publishing -- PyPI's and npm's
# publisher for this repository name this workflow and the `release` environment -- with no token stored anywhere,
# while the PUBLISH_PYPI and PUBLISH_NPM repository variables are on. Once PyPI has the version, server.json lists it in
# the MCP Registry, the workflow proving itself to the registry the same way.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build the packages
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: The tag is the package's version
        run: grep -qx "__version__ = \"${GITHUB_REF_NAME#v}\"" src/sim_mirror/_version.py
      - name: Release notes from CHANGELOG.md
        run: uv run --no-project python scripts/release_notes.py "$GITHUB_REF_NAME" > release-notes.md
      - name: The native helper, for both Mac architectures
        run: make helper-release
      - name: Python sdist and wheel
        run: SIM_MIRROR_HELPER_BINARY="$PWD/dist/helper/sim-mirror-helper" uv build --out-dir dist/python
      - name: The wheel carries the helper
        run: uv run --no-project python scripts/check_wheel.py --helper dist/python/*.whl
      - name: Viewer package
        working-directory: viewer
        run: |
          npm ci
          npm run build:lib
          mkdir -p ../dist/viewer
          npm pack --pack-destination ../dist/viewer
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            dist/
            release-notes.md
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -- dist/python/* dist/viewer/*
          # 0.x versions are previews.
          case "$GITHUB_REF_NAME" in v0.*) set -- "$@" --prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" "$@" --verify-tag \
            --title "SimMirror ${GITHUB_REF_NAME#v}" --notes-file release-notes.md

  pypi:
    name: Publish to PyPI
    needs: github-release
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/python/

  npm:
    name: Publish to npm
    needs: github-release
    if: vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; the job's OIDC token stands in for a token.
      - name: npm with trusted publishing
        run: npm install --global npm@11
      - name: Publish with provenance
        run: npm publish --provenance --access public dist/viewer/*.tgz

  mcp-registry:
    name: List in the MCP Registry
    # The registry checks that PyPI has the version server.json names, so this waits for it.
    needs: pypi
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      PUBLISHER_VERSION: "1.8.1"
      PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@v7
      - name: mcp-publisher, pinned and checked
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check --strict
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: Sign in to the registry as this repository
        run: ./mcp-publisher login github-oidc
      - name: List this version
        run: ./mcp-publisher publish
