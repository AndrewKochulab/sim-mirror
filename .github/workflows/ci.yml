name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  # By hand, on any branch, once this file is on main: `gh workflow run CI --ref <branch>`.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: make lint-python typecheck guards
      - run: make coverage-python

  viewer:
    name: Viewer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - uses: astral-sh/setup-uv@v10.1.0
      - run: npm ci
        working-directory: viewer
      # Lint and typecheck, tests with per-file coverage, then a rebuild that must match the committed page bundle
      # and stay within the size budget.
      - run: make lint-viewer coverage-viewer viewer-bundle
